name: node-latest

# Not a required check: confirms the package still builds, tests and loads (ESM and CJS) on the
# newest Node, while the required gates in ci.yml run on the Node floor from .nvmrc.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, Mondays at 07:00 UTC, so a new Node release is noticed without a PR.
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Check exports (ESM + CJS)
        run: npm run check:exports

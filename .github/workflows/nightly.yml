name: nightly

# Not a required check. Runs the agent-on vs agent-off benchmark and the soak test from bench/
# (see bench/README.md) on the Node floor from .nvmrc.
#
# - The benchmark is informational: its numbers never fail the run (only a broken harness does).
#   The tables go to the job summary and the JSON is kept as an artifact for trend comparison.
# - The soak fails the run on a regression: heap-after-GC growth over the limit, a leaked worker
#   thread or child process, dashboard clients left behind, failed requests, or a process that
#   does not exit on its own.
#
# Job names must not collide with the required check names in ci.yml.

on:
  schedule:
    # Daily at 03:30 UTC.
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    name: Nightly benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Benchmark (informational)
        shell: bash
        run: |
          mkdir -p bench-results
          set +e
          node bench/overhead.mjs --out bench-results/overhead.json | tee bench-results/overhead.md
          status=${PIPESTATUS[0]}
          set -e
          cat bench-results/overhead.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: overhead-benchmark
          path: bench-results/
          if-no-files-found: warn
          retention-days: 90

  soak:
    name: Nightly soak
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Soak (fails on a leak)
        shell: bash
        run: |
          mkdir -p soak-results
          set +e
          node bench/soak.mjs --out soak-results/soak.json | tee soak-results/soak.md
          status=${PIPESTATUS[0]}
          set -e
          cat soak-results/soak.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload soak results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soak
          path: soak-results/
          if-no-files-found: warn
          retention-days: 30

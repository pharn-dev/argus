name: publish

# Manual runs prepare and verify a tarball only. GitHub Releases publish only after the
# repository variable NPM_PUBLISH_ENABLED is exactly "true". See docs/RELEASING.md.
# Build has no OIDC permission; publish installs nothing and executes no package scripts.
# A compromised build dependency can still alter tarball contents, but cannot mint a token.

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the main-ancestry check below needs history
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify release source
        id: tag
        env:
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').version")"
          [[ "$PKG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "package version is not X.Y.Z"; exit 1; }
          if [ "$RELEASE_EVENT" = "release" ]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
            [ "${GITHUB_REF_NAME#v}" = "$PKG" ] || { echo "tag $GITHUB_REF_NAME != package.json $PKG"; exit 1; }
          elif [ "$RELEASE_EVENT" != "workflow_dispatch" ]; then
            echo "unsupported release event"; exit 1
          fi
          [ "$(node -p "String(require('./package.json').private === true)")" = "false" ] || { echo "package.json is still private: true"; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "selected commit is not on main"; exit 1; }
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
      - name: Install
        run: npm ci
      - name: Gates
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run check:pins
      - name: Build and check package
        run: |
          npm run build
          npm run check:exports
          npm run check:package
      - name: Pack
        id: pack
        run: node scripts/pack-release.mjs "$RUNNER_TEMP/pkg"
      - name: Smoke the packed package
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm run check:install -- "$RUNNER_TEMP/pkg/$TARBALL"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/pkg/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'release' && vars.NPM_PUBLISH_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC: npm Trusted Publishing + provenance. THIS job only.
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm >= 11.5.1 (and node >= 22.14.0). Node 24 bundles a satisfying
      # npm, so this step ASSERTS the floor instead of installing a floating `latest` npm: the job
      # that holds `id-token: write` downloads no third-party tool at all. Pure node stdlib, no
      # network. Fail-closed rests on the PARSE: an `npm --version` that fails or prints nothing
      # arrives here as "" and exits 1 as an unparseable version.
      - name: Assert npm floor
        run: |
          set -euo pipefail
          node -e '
            const parse = (v) => {
              const m = /^(\d+)\.(\d+)\.(\d+)/.exec(String(v ?? "").trim());
              if (!m) { console.error(`npm floor: unparseable version ${JSON.stringify(v)}`); process.exit(1); }
              return m.slice(1, 4).map(Number);
            };
            const [found, floor] = process.argv.slice(1);
            const f = parse(found), n = parse(floor);
            if ((f[0] - n[0] || f[1] - n[1] || f[2] - n[2]) < 0) {
              console.error(`npm floor NOT met: found ${found.trim()}, need >= ${floor} (npm Trusted Publishing minimum)`);
              process.exit(1);
            }
            console.log(`npm floor OK: npm ${found.trim()} >= ${floor}`);
          ' "$(npm --version)" 11.5.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball
          path: pkg
      # Exactly the tarball built for the verified tag, by name; --ignore-scripts so nothing from
      # the package runs here. `--provenance` emits a signed attestation via the same OIDC token.
      # The leading `./` is load-bearing: a bare `pkg/x.tgz` matches npm's GitHub `owner/repo`
      # shorthand and is resolved as a git repo, not the file.
      - name: Publish
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          set -euo pipefail
          [[ "$TARBALL" =~ ^[A-Za-z0-9._-]+\.tgz$ ]] || { echo "unexpected tarball name: $TARBALL"; exit 1; }
          npm publish "./pkg/${TARBALL}" --provenance --access public --ignore-scripts

name: publish

# Publishes to npm when a GitHub Release is published (the manual release process in
# docs/RELEASING.md): create the release for tag vX.Y.Z, matching package.json "version", and this
# runs. The first publish of a new package name is a one-time manual step (docs/RELEASING.md).
#
# Auth is npm Trusted Publishing (OIDC), configured on npmjs.com for THIS workflow file
# (publish.yml) and the environment `npm-publish`. No token or secret appears anywhere in here.
#
# TWO JOBS, and the split is the point. Any step in a job holding `id-token: write` can request the
# OIDC token npm trades for publish rights. If one job ran `npm ci` (install scripts of every dev
# dependency) and `npm publish` together, one compromised dev dependency could publish a malicious
# version with a valid provenance attestation. So:
#   - `build` has NO id-token. It refuses anything but a strict vX.Y.Z tag on a commit that is
#     contained in main (before `npm ci`), runs every gate, packs the tarball, smoke-installs it
#     and uploads it as an artifact.
#   - `publish` is the ONLY job with id-token and the `npm-publish` environment. It checks out
#     nothing, installs nothing, and publishes the prebuilt tarball with --ignore-scripts.
# Residual, named: the tarball is produced in `build`, so a compromised dev dependency there can
# still alter its CONTENT. It can no longer mint a token or publish on its own.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the main-ancestry check below needs history
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Before `npm ci`, so a bad tag costs no dependency install. Strict: a prerelease or `v`-less
      # tag is refused rather than half-published.
      - name: Verify tag
        id: tag
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
          PKG="$(node -p "require('./package.json').version")"
          [ "${GITHUB_REF_NAME#v}" = "$PKG" ] || { echo "tag $GITHUB_REF_NAME != package.json $PKG"; exit 1; }
          [ "$(node -p "String(require('./package.json').private === true)")" = "false" ] || { echo "package.json is still private: true; see docs/RELEASING.md"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main"; exit 1; }
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
      - name: Install
        run: npm ci
      - name: Gates
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run check:pins
      # `npm pack` runs prepack (the build) here, in the unprivileged job. npm does NOT create
      # --pack-destination, so make it first.
      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pkg"
          npm pack --pack-destination "$RUNNER_TEMP/pkg" --json > "$RUNNER_TEMP/pack.json"
          TARBALL="$(node -p "require(process.env.RUNNER_TEMP + '/pack.json')[0].filename")"
          [[ "$TARBALL" =~ ^[A-Za-z0-9._-]+\.tgz$ ]] || { echo "unexpected tarball name: $TARBALL"; exit 1; }
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
      # Install the packed tarball into an empty project and load every exported subpath through
      # both import and require, so a broken `exports` map or a missing dist file fails here.
      - name: Smoke the packed package
        working-directory: ${{ runner.temp }}
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          mkdir smoke && cd smoke
          npm init -y > /dev/null
          npm install --no-audit --no-fund "../pkg/${TARBALL}"
          NAME="$(node -p "require('${GITHUB_WORKSPACE}/package.json').name")"
          node --input-type=module -e '
            import { createRequire } from "node:module";
            import { readFileSync } from "node:fs";
            const name = process.argv[1];
            const require = createRequire(process.cwd() + "/");
            const pkg = JSON.parse(readFileSync(`node_modules/${name}/package.json`, "utf8"));
            for (const sub of Object.keys(pkg.exports)) {
              if (sub === "./package.json") continue;
              const spec = name + sub.slice(1);
              await import(spec);
              require(spec);
              console.log("ok", spec);
            }
          ' "$NAME"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/pkg/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC: npm Trusted Publishing + provenance. THIS job only.
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm >= 11.5.1 (and node >= 22.14.0). Node 24 bundles a satisfying
      # npm, so this step ASSERTS the floor instead of installing a floating `latest` npm: the job
      # that holds `id-token: write` downloads no third-party tool at all. Pure node stdlib, no
      # network. Fail-closed rests on the PARSE: an `npm --version` that fails or prints nothing
      # arrives here as "" and exits 1 as an unparseable version.
      - name: Assert npm floor
        run: |
          set -euo pipefail
          node -e '
            const parse = (v) => {
              const m = /^(\d+)\.(\d+)\.(\d+)/.exec(String(v ?? "").trim());
              if (!m) { console.error(`npm floor: unparseable version ${JSON.stringify(v)}`); process.exit(1); }
              return m.slice(1, 4).map(Number);
            };
            const [found, floor] = process.argv.slice(1);
            const f = parse(found), n = parse(floor);
            if ((f[0] - n[0] || f[1] - n[1] || f[2] - n[2]) < 0) {
              console.error(`npm floor NOT met: found ${found.trim()}, need >= ${floor} (npm Trusted Publishing minimum)`);
              process.exit(1);
            }
            console.log(`npm floor OK: npm ${found.trim()} >= ${floor}`);
          ' "$(npm --version)" 11.5.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball
          path: pkg
      # Exactly the tarball built for the verified tag, by name; --ignore-scripts so nothing from
      # the package runs here. `--provenance` emits a signed attestation via the same OIDC token.
      # The leading `./` is load-bearing: a bare `pkg/x.tgz` matches npm's GitHub `owner/repo`
      # shorthand and is resolved as a git repo, not the file.
      - name: Publish
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          set -euo pipefail
          [[ "$TARBALL" =~ ^[A-Za-z0-9._-]+\.tgz$ ]] || { echo "unexpected tarball name: $TARBALL"; exit 1; }
          npm publish "./pkg/${TARBALL}" --provenance --access public --ignore-scripts

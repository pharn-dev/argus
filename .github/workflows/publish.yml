name: publish

# Release on merge. Every push to main runs this workflow; it releases exactly when
# package.json's version has no `v<version>` tag yet. The version bump and its CHANGELOG
# section travel in the PR, so merging that PR is the release. A merge that does not bump
# the version (docs, dependabot, a change saved for a later release) ends at the `gate` job
# and publishes nothing. See docs/RELEASING.md.
#
#   gate -> build -> publish -> release
#
# The repository variable NPM_PUBLISH_ENABLED is the publish kill-switch: unless it is exactly
# "true", `publish` and `release` are skipped (a tag must still mean "on npm"), while `gate` and
# `build` still run, so a merged bump still produces a checked tarball artifact.
#
# Auth = npm Trusted Publishing (OIDC), configured on npmjs.com for this workflow (publish.yml) and
# the environment `npm-publish`. No secrets or tokens appear in this workflow. The first publish of
# the package name was manual (docs/RELEASING.md).
#
# The job split is the point. Any step in a job that holds `id-token: write` can request the OIDC
# token npm trades for publish rights, so no job that installs dev dependencies or runs the gates
# may hold it:
#   - `gate` reads package.json and asks the remote whether the tag exists. It installs nothing
#     and holds no write permission.
#   - `build` has NO id-token. It checks the version and that the commit is on main, extracts the
#     release notes (before `npm ci`), runs the gates, packs the tarball, smoke-installs it and
#     uploads tarball + notes as an artifact.
#   - `publish` is the ONLY job with id-token and the `npm-publish` environment. It checks out
#     nothing, installs nothing, skips the publish when the registry already has the version (a
#     re-run after a later failure), and otherwise publishes the prebuilt tarball.
#   - `release` is the ONLY job with `contents: write`. It checks out nothing and installs
#     nothing: it tags the built commit and creates the GitHub Release from the notes. It runs after
#     npm, so a tag always means "on npm".
# Residual, named: the tarball is produced in `build`, so a compromised dev dependency there can
# still alter its CONTENT; it can no longer mint a token or publish on its own.
# scripts/check-publish-workflow.mjs (run by `npm test`) pins this graph and these permissions.
on:
  push:
    branches: [main]
  # Recovery: re-drive a release whose run was cancelled or superseded. The gate refuses any ref
  # but main, so this can only release the version on main.
  workflow_dispatch:

# Workflow-level, so a second merge's `gate` cannot read "no tag" while the first run is still
# between publish and release. Never cancel a run mid-release.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `git ls-remote --exit-code` exits 0 when the tag exists and 2 when it does not; anything
      # else (network, auth) fails the run rather than reading as "no tag". `|| rc=$?` keeps
      # `set -e` from ending the step on exit 2.
      - name: Decide
        id: decide
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "publish runs only on refs/heads/main, not $GITHUB_REF"; exit 1; }
          VERSION="$(node -p "require('./package.json').version")"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "package.json version $VERSION is not X.Y.Z"; exit 1; }
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null || rc=$?
          case "$rc" in
            0) RELEASE=false; echo "v$VERSION is already tagged: nothing to release" ;;
            2) RELEASE=true; echo "v$VERSION has no tag: releasing" ;;
            *) echo "git ls-remote exited $rc: cannot tell whether v$VERSION is released"; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the main-ancestry check below needs history
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Before `npm ci`, so a bad version costs no dependency install.
      - name: Verify version
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "version $VERSION is not X.Y.Z"; exit 1; }
          PKG="$(node -p "require('./package.json').version")"
          [ "$PKG" = "$VERSION" ] || { echo "package.json $PKG != gate version $VERSION"; exit 1; }
          [ "$(node -p "String(require('./package.json').private === true)")" = "false" ] || { echo "package.json is still private: true"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main"; exit 1; }
      # Also before `npm ci`: a bump without its CHANGELOG section fails here.
      - name: Release notes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pkg"
          node scripts/release-notes.mjs "$VERSION" CHANGELOG.md > "$RUNNER_TEMP/pkg/RELEASE_NOTES.md"
      - name: Install
        run: npm ci
      - name: Gates
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run check:pins
      - name: Build and check package
        run: |
          npm run build
          npm run check:exports
          npm run check:package
      - name: Pack
        id: pack
        run: node scripts/pack-release.mjs "$RUNNER_TEMP/pkg"
      - name: Check packed version
        run: |
          set -euo pipefail
          PACKED="$(node -p "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')).version" "$RUNNER_TEMP/pkg/metadata.json")"
          [ "$PACKED" = "$VERSION" ] || { echo "packed version $PACKED != $VERSION"; exit 1; }
      - name: Smoke the packed package
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm run check:install -- "$RUNNER_TEMP/pkg/$TARBALL"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/pkg/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [gate, build]
    if: needs.gate.outputs.release == 'true' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC: npm Trusted Publishing + provenance. THIS job only.
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm >= 11.5.1 (and node >= 22.14.0). Node 24 bundles a satisfying
      # npm, so this step ASSERTS the floor instead of installing a floating `latest` npm: the job
      # that holds `id-token: write` downloads no third-party tool at all. Pure node stdlib, no
      # network. Fail-closed rests on the PARSE: an `npm --version` that fails or prints nothing
      # arrives here as "" and exits 1 as an unparseable version.
      - name: Assert npm floor
        run: |
          set -euo pipefail
          node -e '
            const parse = (v) => {
              const m = /^(\d+)\.(\d+)\.(\d+)/.exec(String(v ?? "").trim());
              if (!m) { console.error(`npm floor: unparseable version ${JSON.stringify(v)}`); process.exit(1); }
              return m.slice(1, 4).map(Number);
            };
            const [found, floor] = process.argv.slice(1);
            const f = parse(found), n = parse(floor);
            if ((f[0] - n[0] || f[1] - n[1] || f[2] - n[2]) < 0) {
              console.error(`npm floor NOT met: found ${found.trim()}, need >= ${floor} (npm Trusted Publishing minimum)`);
              process.exit(1);
            }
            console.log(`npm floor OK: npm ${found.trim()} >= ${floor}`);
          ' "$(npm --version)" 11.5.1
      # Idempotency: a re-run after `release` failed must not publish again. Only the HTTP status
      # is read: 200 (already on npm) skips the publish, 404 publishes, anything else (or no
      # answer) fails the run. Pure node stdlib.
      - name: Registry check
        id: registry
        env:
          VERSION_URL: https://registry.npmjs.org/@pharn-dev%2fphargus/${{ needs.gate.outputs.version }}
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            const url = process.env.VERSION_URL;
            let status;
            try {
              const res = await fetch(url, { redirect: "error", signal: AbortSignal.timeout(15000) });
              status = res.status;
              await res.body?.cancel();
            } catch (err) {
              console.error(`registry check: no answer from ${url}: ${err.message}`);
              process.exit(1);
            }
            const published = { 200: "true", 404: "false" }[status];
            if (published === undefined) {
              console.error(`registry check: unexpected HTTP ${status} from ${url}`);
              process.exit(1);
            }
            console.log(`registry check: HTTP ${status} from ${url} -> published=${published}`);
            appendFileSync(process.env.GITHUB_OUTPUT, `published=${published}\n`);
          '
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: pkg
      # Exactly the tarball built for the verified version, by name; --ignore-scripts so nothing
      # from the package runs here. `--provenance` emits a signed attestation via the same OIDC
      # token. The leading `./` is load-bearing: a bare `pkg/x.tgz` matches npm's GitHub
      # `owner/repo` shorthand and is resolved as a git repo, not the file.
      - name: Publish
        if: steps.registry.outputs.published == 'false'
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          set -euo pipefail
          [[ "$TARBALL" =~ ^[A-Za-z0-9._-]+\.tgz$ ]] || { echo "unexpected tarball name: $TARBALL"; exit 1; }
          npm publish "./pkg/${TARBALL}" --provenance --access public --ignore-scripts

  release:
    needs: [gate, publish]
    if: needs.gate.outputs.release == 'true' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag + GitHub Release. THIS job only; no id-token here.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: pkg
      # A release created with GITHUB_TOKEN triggers no other workflow, which is why tagging
      # happens here rather than in a separate on-release workflow. An existing Release (a
      # re-run) is left alone.
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes-file pkg/RELEASE_NOTES.md
